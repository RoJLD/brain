# A layer of the catalogue (research_graph layers); docs: README.md, « Graph templates ».
name: docs_tests
version: 1
title: "The docs, tests and CI jobs a node is documented in, tested by and run by, generated from the repos' trees"
requires: [work]
mode: generated
generator: "brain sync (brain.links: nodes/_generated_links.yaml), only when the schema has Doc, Test or Workflow"
node_types:
  Doc: "a section of a doc: a README, docs/** or a runbook (headings 1-2), a spec of docs/specs (1-3)"
  Test: "a test module (pytest, Pester, shell, JS), or the folder that holds test modules"
  Workflow: "a CI or deployment job: one job of .github/workflows/<file>.yml"
edge_types:
  documented_in:
    - {from: "*", to: [Doc], why: "a node -> a doc section that names its id or its code"}
  tested_by:
    - {from: "*", to: [Test], why: "a node implemented by code -> a test module that covers that code"}
  runs:
    - {from: [Workflow], to: [Test], why: "a CI job -> a test module or folder its steps run"}
  part_of:
    - {from: [Doc], to: [Spec, Doc], why: "a spec's section -> its spec"}
    - {from: [Test], to: [Test], why: "a test module -> its folder, a folder -> the folder above it"}
statuses: [active]
status_by_type:
  Doc: [active]
  Test: [active]
  Workflow: [active]
ids: {Doc: "doc:<repo>:<path>[::<section>]", Test: "test:<repo>:<path>", Workflow: "workflow:<repo>:<path>::<job>"}
commands: ["brain sync", "brain audit"]
views: ["brain audit (a unit without its test or doc)"]
checks: ["an anchor that does not resolve (research_graph check)"]
projection: {gitnexus: research-graph, colors: {Doc: "#84cc16", Test: "#22c55e", Workflow: "#15803d"}}
lifecycle: {typologies: [software, api-cli], proposed_at: [build]}
examples:
  nodes:
    - {id: "doc:example:README.md::usage", type: Doc, status: active, title: "README.md § Usage"}
    - {id: "test:example:tests/test_board.py", type: Test, status: active, title: "tests/test_board.py"}
    - {id: "test:example:tests", type: Test, status: active, title: "tests/"}
    - {id: "workflow:example:.github/workflows/ci.yml::test", type: Workflow, status: active, title: "ci.yml: test"}
  edges:
    - {from: example-wi-first, to: "doc:example:README.md::usage", type: documented_in}
    - {from: example-wi-first, to: "test:example:tests/test_board.py", type: tested_by}
    - {from: "test:example:tests/test_board.py", to: "test:example:tests", type: part_of}
    - {from: "workflow:example:.github/workflows/ci.yml::test", to: "test:example:tests", type: runs}
