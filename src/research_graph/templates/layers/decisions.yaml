# A layer of the catalogue (research_graph layers); docs: README.md, « Graph templates ».
name: decisions
version: 1
title: "The architecture decisions: one ADR node per dated heading of the decision log"
requires: []
mode: generated
generator: "research_graph sync (the ADR log, notes/decisions.md by default)"
node_types:
  ADR: "an architecture decision, a dated heading of the decision log; generated by sync, anchored at its heading"
edge_types:
  decided_by:
    - {from: "*", to: [ADR], why: "a node follows the decision that introduced or changed it"}
  supersedes:
    - {from: [ADR], to: [ADR], why: "a decision reverses or replaces an earlier one"}
statuses: [active, superseded]
status_by_type:
  ADR: [active, superseded]
ids: {ADR: "adr-<date>-<slug> (sync derives it from the heading)"}
commands: ["research_graph sync --write", "research_graph decisions <id>", "brain adr new|show"]
views: ["the decisions behind a node (research_graph decisions <id>)"]
checks: ["a dated heading of the log without its ADR node (research_graph check)", "an anchor that does not resolve"]
projection: {gitnexus: research-graph, colors: {ADR: "#f59e0b"}}
lifecycle: {typologies: ["*"], proposed_at: ["*"]}
examples:
  nodes:
    - {id: example-adr-keep-the-backlog-in-the-graph, type: ADR, status: active,
       title: "Keep the backlog in the graph, not in a tracker"}
    - {id: example-adr-an-older-choice, type: ADR, status: superseded, title: "An older choice, replaced"}
  edges:
    - {from: example-adr-keep-the-backlog-in-the-graph, to: example-adr-an-older-choice, type: supersedes}
