# Work layer: specs, milestones and work items, one flow-style node per entry. These are examples: replace them.
# Ids are kebab-case and unique in the store (wi- items, ms- milestones, spec- specs). Statuses come from schema.yaml.
# Useful props: priority (P0-P3), priority_proposed and priority_reason, open (a question waiting on the owner),
# external_blocker (what holds a blocked item), trigger and reached (a milestone), pr and done (a closed item).
- {id: spec-example, type: Spec, status: proposed, title: "What the first milestone delivers, and why",
   anchor: "docs/specs/2026-01-01-example-spec.md#top"}
- {id: ms-first, type: Milestone, status: pending, title: "First milestone",
   props: {trigger: "the three example items are done"}}
- {id: wi-first-step, type: WorkItem, status: todo, title: "First step: say what done looks like in one line",
   props: {priority: P1}}
- {id: wi-second-step, type: WorkItem, status: todo, title: "Second step, which waits on the first",
   props: {priority_proposed: P2, priority_reason: "useful once the first step is done"}}
- {id: wi-needs-a-decision, type: WorkItem, status: blocked, title: "A step that waits on a decision",
   props: {priority: P2, external_blocker: "{owner} chooses between two options", open: "which option?"}}
