name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint
        run: pip install ruff && ruff check src tests
      - name: Tests (moved tests and golden outputs)
        run: pytest

  brain:
    # The brain command, from this checkout: research-graph installed editable first, so its git pin (the same tag)
    # is not fetched. Windows first: its hooks run in Git Bash, its installer in Windows PowerShell.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .
          pip install --no-deps -e packages/brain
          pip install pyyaml pytest pytest-xdist pytest-cov "tomli>=2; python_version < '3.11'"
      - name: Tests
        # in parallel, one worker per core (pytest-xdist); the real docker client apart, on one process. On 3.12 the
        # same run measures the coverage with test contexts (wi-brain-test-coverage): its data file is the artifact
        # coverage-data, which `brain coverage --repo brain --from coverage.data --cwd packages/brain` reads in a
        # checkout at the same commit (packages/brain/docs/tests-graph.md)
        working-directory: packages/brain
        env:
          COVERAGE_FILE: coverage.data
        run: >-
          pytest tests -p no:randomly -n auto -m "not docker" --durations=15
          ${{ matrix.python-version == '3.12' && '--cov=src --cov-context=test --cov-report=term:skip-covered --cov-fail-under=0' || '' }}
      - name: Coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: packages/brain/coverage.data
          retention-days: 14
      - name: Tests (docker)
        run: pytest packages/brain -p no:randomly -m docker

  brain-linux:
    # Advisory until the brain command's suite is green on Linux (its tests were first run on Windows).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          pip install --no-deps -e packages/brain
          pip install pyyaml pytest pytest-xdist
      - name: Tests
        run: pytest packages/brain -p no:randomly -n auto -m "not docker"
      - name: Tests (docker)
        run: pytest packages/brain -p no:randomly -m docker

  compat-prev:
    # The upgrade test (wi-brain-upgrade-test; spec-brain-data-compat N8, COMPAT-2 and COMPAT-3), before any tag: the
    # last tag before this commit writes every registered format into a new brain, this checkout is installed over it
    # and runs the store plan, the scenario and brain check on it, then the tag again reads HEAD's additive data
    # (the rollback the installer does until the pin moves), the vault drill included, and loses none of it.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The last tag
        id: prev
        shell: bash
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upgrade from ${{ steps.prev.outputs.tag }}, then back
        shell: bash
        run: |
          pip install pyyaml
          python packages/brain/installer/stranger_test.py --source . --upgrade-from "${{ steps.prev.outputs.tag }}" \
            --work "$RUNNER_TEMP/compat-prev"
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-prev-report
          path: ${{ runner.temp }}/compat-prev/report.json
          retention-days: 14

  harness-controls:
    # The harness's negative controls (wi-brain-harness-negative-controls; docs/formats.md, « Negative controls »):
    # the upgrade test rerun once with each injected fault, every one a no-go at the step that guards against it, and
    # once without, a go; the plain stranger test with a denied term, a leak. Slow (each run installs the engine four
    # times): only on a pull request that touches the harness, its fixtures or the workflows.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Does this pull request touch the harness?
        id: touched
        shell: bash
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          test -n "$files"
          if printf '%s\n' "$files" | grep -qE '^(packages/brain/installer/stranger_test\.py|packages/brain/tests/(fixtures/formats/|test_harness_negative_controls\.py|test_stranger_test\.py)|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.touched.outputs.run == 'true'
        run: |
          pip install -e .
          pip install --no-deps -e packages/brain
          pip install pyyaml pytest pytest-xdist "tomli>=2; python_version < '3.11'"
      - name: Every fault a no-go, no fault a go
        if: steps.touched.outputs.run == 'true'
        working-directory: packages/brain
        run: pytest tests/test_harness_negative_controls.py -m harness -p no:randomly -n 6 --durations=10

  release-preview:
    # The release preview (wi-brain-release-preview; docs/release.md, « The release preview »): on every PR, the version
    # policy applied as if the next release were a patch of the last tag. It says whether that release would be a minor
    # one (a registered schema that moved, a pending Upgrade step beyond the standard ones) and which reasons this PR
    # carries, in the job's summary. Advisory: it never fails the PR. Standard library only: nothing to install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Would the next release be a patch?
        run: python packages/brain/installer/release_check.py --preview --base "origin/${{ github.base_ref }}"

  release-check:
    # The version PR's check (docs/release.md; spec-brain-data-compat, gate item 6), before any tag: a registered schema
    # changed since the last tag with no ### Upgrade in this version's CHANGELOG section, or a place left at the old
    # version, a section with no theme, or a patch that breaks the version policy (a schema change, an Upgrade step
    # beyond the standard ones). Any other pull request has only its changelog fragments checked (one malformed, a
    # standard step two fragments ask). Standard library only: nothing to install.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The version PR's Upgrade section and version
        run: python packages/brain/installer/release_check.py

  release-tag:
    # pip reinstalls a git-pinned dependency only when its version changes: a tag vX.Y.Z must carry __version__ X.Y.Z in
    # both distributions, and brain must pin research-graph at that tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches both versions and the pin
        run: |
          v() { python -c "import re, pathlib, sys; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path(sys.argv[1]).read_text()).group(1))" "$1"; }
          graph=$(v src/research_graph/__init__.py)
          brain=$(v packages/brain/src/brain/__init__.py)
          test "${GITHUB_REF_NAME}" = "v${graph}" || { echo "tag ${GITHUB_REF_NAME} != research-graph v${graph}"; exit 1; }
          test "${GITHUB_REF_NAME}" = "v${brain}" || { echo "tag ${GITHUB_REF_NAME} != brain v${brain}"; exit 1; }
          grep -q "research-graph @ git+https://github.com/RoJLD/brain.git@${GITHUB_REF_NAME}\"" packages/brain/pyproject.toml \
            || { echo "packages/brain/pyproject.toml does not pin research-graph at ${GITHUB_REF_NAME}"; exit 1; }
      - name: Tag signature (advisory)
        # wi-brain-release-signing (STD-3): the owner signs each tag from v0.3.2 on (git tag -s, gpg.format ssh). The
        # keys that verify it live in the owner's allowed_signers, not in this repo (publishing them is a separate
        # decision), so this job only says whether the tag carries an SSH signature; it never fails on it. brain update
        # and the installer verify it against the keys before installing (docs/release.md).
        run: |
          git fetch --quiet --no-tags --depth 1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag ] \
              && git cat-file -p "refs/tags/${GITHUB_REF_NAME}" | grep -q -- "-----BEGIN SSH SIGNATURE-----"; then
            echo "::notice::${GITHUB_REF_NAME} carries an SSH signature (verified by brain update and the installer)"
          else
            echo "::warning::${GITHUB_REF_NAME} is not signed: brain update and the installer refuse it where engine.verify_tags is on (docs/release.md, « 3. The tag »)"
          fi
