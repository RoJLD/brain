[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-graph"
description = "A typed, layered knowledge graph kept as YAML in a git repo: loader, validation, sync, queries, generated kanban and roadmap views"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "pyyaml>=6"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
research_graph = "research_graph.cli:main"

[tool.setuptools.dynamic]
version = {attr = "research_graph.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_graph = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
