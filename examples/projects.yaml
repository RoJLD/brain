# Example registry for the `brain` command: the projects it knows (brain --project NAME, brain refresh --all,
# brain decision pending --all). `brain init` writes a first one with the brain itself (packages/brain); add the
# others like these.
#
# root: the project's checkout, relative to the brain repo. Its graph store (notes/graph), journal (notes/journal.md)
#       and ADR log (notes/decisions.md) are found under the root; `stores:` lists other stores when it has several.
# production: the checkouts a service or a scheduled task runs from, relative to the root; the brain's guards refuse
#       edits and git changes there (work in a worktree, merge by PR, then pull).
# stacks: what brain up / down / health start, stop and check (depends_on, cwd, start, stop, health {urls, cmd},
#       logs, timeout, detach, watch); omit it when the project runs no service.
# access: read for a project the brain reads and never writes (its own sessions write it): title and access only.
#
# Each store is started with `research_graph --store <root>/notes/graph --repo-root <root> init --owner <you>`; a
# store elsewhere names its views folder and its decision log (`--views ops --no-decisions`, `--views prog
# --decisions prog/decisions.md`), as `brain sync` then passes them.

my-brain:            # this brain: your rules, decisions and personal backlog
  root: .

my-project:          # a project next to it, with its own graph store
  root: ../my-project
  production: [.]

team-project:        # a project with a second store (an operations graph, say): its board and roadmap are in ops/,
  root: ../team-project   # beside it, and the project's ADR log is covered by its first store only
  stores: [notes/graph, ops/graph]

lab:                 # two projects at one root: the first registered owns it (its records, its views in notes/,
  root: ../lab       # its repo for brain audit)...
prog:                # ...the next has its own store, journal and ADR log, its views beside its store (prog/)
  root: ../lab
  title: a programme kept in the lab's repo
  stores: [prog/graph]
  journal: prog/journal.md
  decisions: prog/decisions.md

upstream:            # read only: the brain reads it and never writes it (no root, no store, no guard)
  title: a project the brain follows without writing to it
  access: read
