# The vocabulary of this graph store, the brain's base (brain init, a template's graphs schema: default): the work
# (items, milestones, specs), the decisions (the ADR log) and the records brain sync turns into nodes (DDR: a question
# put to the owner; Session: an agent session; Action: what a session did). `research_graph check` validates every
# node and edge against it; add the types your projects need (a research layer, a data layer...).
# owner: who decides for this store, a person or a team; `research_graph pending` lists the items blocked on them.
{owner_line}node_types: [WorkItem, Milestone, Spec, ADR, DDR, Session, Action]
edge_types: [depends_on, part_of, specified_by, decided_by, supersedes, raised_by, answered_in, about, produced_by,
             touches]
statuses: [todo, doing, blocked, done, dropped, pending, reached, proposed, active, superseded, answered, integrated,
           archived, open, closed, recorded]
layers:
  work: [WorkItem, Milestone, Spec]
  decisions: [ADR]
  records: [DDR, Session, Action]
status_by_type:
  WorkItem: [todo, doing, blocked, done, dropped]
  Milestone: [pending, reached, dropped]
  Spec: [proposed, active, superseded]
  ADR: [active, superseded]
  DDR: [pending, answered, integrated, archived]
  Session: [open, closed]
  Action: [recorded]
