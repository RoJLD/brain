# The base of the project templates: a base, which brain init --template does not take (its name starts with "_");
# the profiles' templates extend it, through _software, or take from _software what they need. The generic brain,
# plus an ADR template for the project's own decisions. It writes nothing of a code host (no .github/: that is
# _software's), so a project that is not code, or not on GitHub, extends it alone.
name: _project
version: 1
engine: ">=0.4.0"
title: "A project's brain: the generic brain and an ADR template"
extends: generic
files:                     # the brain's path: the template's file (added to generic's)
  docs/templates/adr.md: adr.md
