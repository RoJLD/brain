# Prometheus of the sovereign stack: the collector's metrics (Claude Code's, once wi-brain-otel-telemetry points it
# here) and the components' own. A component that is off is a target down, nothing more. Retention: 30 days (the
# command line in compose.yaml).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: qdrant
    static_configs:
      - targets: [qdrant:6333]
