[build-system]
requires = ["setuptools>=77"]   # PEP 639: license as an SPDX expression, license-files
build-backend = "setuptools.build_meta"

[project]
name = "brain"
description = "A person's or a team's work state in git, at zero token: records (DDR, SR, AR), backlog, decisions, journal, generated views, Claude Code hooks and guards"
readme = "README.md"
# The Business Source License 1.1 from 0.2.2 (0.2.0 and 0.2.1 were released under MIT); research-graph stays MIT.
license = "BUSL-1.1"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# The graph engine of this repo, at this distribution's own tag: the two distributions share one tag series and one
# version (a release moves both __version__, the CI checks they agree).
dependencies = ["pyyaml>=6", "research-graph @ git+https://github.com/RoJLD/brain.git@v0.3.2",
                "tomli>=2; python_version < '3.11'"]
dynamic = ["version"]

[project.optional-dependencies]
# pytest-xdist: the suite runs in parallel (pytest -n auto), each worker with its own temp folders and BRAIN_HOME
test = ["pytest>=8", "pytest-xdist>=3.5", "pytest-cov>=5"]
# brain tui's Textual app (the cockpit); without it brain tui draws its text view
tui = ["textual>=1.0"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.dynamic]
version = {attr = "brain.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain", "brain.commands"]   # brain.commands: the command registry (one module per command)

[tool.setuptools.package-data]
brain = ["schemas/*.json", "tiers.yaml", "catalogs/*.yaml", "compose/*/*", "procedures/*/*", "templates/*",
         "templates/*/*",
         "adapters/claude/allow-rules.txt", "adapters/claude/hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# docker: calls the real docker client, flaky on a busy runner; the CI runs it apart, on one process, after the rest
markers = ["docker: calls the real docker client (the CI runs these apart: -m docker)",
           "harness: reruns the stranger test with an injected fault (slow, installs; skipped unless -m harness)"]

[tool.coverage.run]
# the CI's coverage data names its files relative to packages/brain, so brain coverage --from reads it in any checkout
relative_files = true
