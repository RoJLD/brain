[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain"
description = "A person's or a team's work state in git, at zero token: records (DDR, SR, AR), backlog, decisions, journal, generated views, Claude Code hooks and guards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The graph engine of this repo, at this distribution's own tag: the two distributions share one tag series and one
# version (a release moves both __version__, the CI checks they agree).
dependencies = ["pyyaml>=6", "research-graph @ git+https://github.com/RoJLD/brain.git@v0.2.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]
# brain tui's Textual app (the cockpit); without it brain tui draws its text view
tui = ["textual>=1.0"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.dynamic]
version = {attr = "brain.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["brain"]

[tool.setuptools.package-data]
brain = ["schemas/*.json", "tiers.yaml", "compose/*/*", "procedures/*/*", "templates/*", "templates/*/*",
         "adapters/claude/allow-rules.txt", "adapters/claude/hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
